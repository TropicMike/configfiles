name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes an in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# An explicit `shell: bash` runs steps with -o pipefail (the implicit default
# shell doesn't), so a failing ./deploy.sh can't hide behind `| tee`.
defaults:
  run:
    shell: bash

jobs:
  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      # SC1090/SC1091 (can't follow sourced files) are excluded because every
      # sourced file is checked directly here anyway. -s bash is needed for
      # the files without a shebang (.aliases, .bashrc).
      - name: shellcheck
        run: shellcheck -s bash -S warning -e SC1090,SC1091 deploy.sh claude-statusline.sh .aliases Linux/.bashrc MacOS/macos-fix-home-end.sh

      - name: bash syntax check
        run: |
          for f in deploy.sh claude-statusline.sh .aliases Linux/.bashrc MacOS/macos-fix-home-end.sh; do
            bash -n "$f"
          done

      - name: zsh syntax check
        run: |
          zsh -n .aliases
          zsh -n MacOS/.zshrc

      # opencode.jsonc may gain // comments (JSONC), which jq rejects, so
      # whole-line comments are stripped before validating.
      - name: JSON config validity
        run: |
          jq empty claude-prompt.json
          sed 's#^[[:space:]]*//.*##' opencode/opencode.jsonc | jq empty

      # .gitattributes keeps *.reg bytes untouched (-text) because regedit
      # wants UTF-16 LE with a BOM; check the bytes really are that.
      - name: .reg files are UTF-16 LE with BOM
        run: |
          while IFS= read -r -d '' f; do
            if [ "$(head -c 2 "$f" | od -An -tx1 | tr -d ' ')" != "fffe" ]; then
              echo "missing UTF-16 LE BOM: $f"; exit 1
            fi
          done < <(find . -name '*.reg' -print0)

      # Renders the status line from fixture JSON and compares the text with
      # the ANSI colors stripped.
      - name: Claude status line
        run: |
          render() { ./claude-statusline.sh | sed 's/\x1b\[[0-9;]*m//g'; }
          me="$(id -un)@$(hostname -s)"
          out="$(echo '{"workspace":{"current_dir":"/srv/my proj"},"model":{"display_name":"Opus"},"cost":{"total_cost_usd":0.4251},"context_window":{"used_percentage":12.6}}' | render)"
          test "$out" = "$me:my proj | Opus | \$0.43 | Ctx:13%"
          # Home shows as ~, and a zero cost is hidden.
          out="$(echo "{\"workspace\":{\"current_dir\":\"$HOME\"},\"model\":{\"display_name\":\"Opus\"},\"cost\":{\"total_cost_usd\":0}}" | render)"
          test "$out" = "$me:~ | Opus"
          # A missing middle field doesn't shift the ones after it.
          out="$(echo '{"workspace":{"current_dir":"/"},"context_window":{"used_percentage":50}}' | render)"
          test "$out" = "$me:/ | Ctx:50%"

      # Runs first among the behavior tests so ~/.aliases and ~/.bashrc exist
      # for the source checks below (the rc files source ~/.aliases).
      - name: deploy.sh smoke test
        run: |
          # opencode isn't installed on the runner, so its config must be skipped.
          ./deploy.sh | tee /tmp/deploy-out
          grep -q "SKIP opencode.jsonc (opencode not installed)" /tmp/deploy-out
          test ! -e "$HOME/.config/opencode/opencode.jsonc"
          test -f "$HOME/.aliases"
          test -f "$HOME/.emacs"
          test -f "$HOME/.bashrc"
          # A stub at the installer's default location (not on PATH) must
          # enable the opencode config deploy.
          mkdir -p "$HOME/.opencode/bin"
          printf '#!/bin/sh\n' > "$HOME/.opencode/bin/opencode"
          chmod +x "$HOME/.opencode/bin/opencode"
          ./deploy.sh
          test -f "$HOME/.config/opencode/opencode.jsonc"
          jq -e '.statusLine.type == "command"' "$HOME/.claude/settings.json"
          test -f "$HOME/.claude/statusline.sh"
          # Second run must detect everything as already deployed.
          out="$(./deploy.sh)"
          echo "$out" | grep -q "UNCHANGED"

      # An invalid claude-prompt.json must be skipped without creating or
      # touching settings.json. Runs a copy of deploy.sh next to a broken
      # snippet, against a throwaway HOME (the other files SKIP as not found).
      - name: deploy.sh skips invalid claude-prompt.json
        run: |
          work="$(mktemp -d)"
          cp deploy.sh "$work/"
          echo '{"statusLine":' > "$work/claude-prompt.json"
          export HOME="$work/home"
          mkdir -p "$HOME"
          # Fresh install: no settings.json may be created.
          "$work/deploy.sh" | tee "$work/out1"
          grep -q "SKIP claude-prompt.json (not valid JSON)" "$work/out1"
          test ! -e "$HOME/.claude/settings.json"
          # Existing settings.json: must be left byte-for-byte unchanged, and
          # the snippet (not the destination) must be blamed.
          mkdir -p "$HOME/.claude"
          echo '{"model":"opus"}' > "$HOME/.claude/settings.json"
          cp "$HOME/.claude/settings.json" "$work/before.json"
          "$work/deploy.sh" | tee "$work/out2"
          grep -q "SKIP claude-prompt.json (not valid JSON)" "$work/out2"
          # (not "! grep": a negated command never trips bash -e)
          if grep -q "existing file is not valid JSON" "$work/out2"; then exit 1; fi
          cmp "$work/before.json" "$HOME/.claude/settings.json"
          test ! -e "$HOME/.claude/settings.json.bak"

      # --dry-run must report the plan without writing anything.
      - name: deploy.sh --dry-run writes nothing
        run: |
          export HOME="$(mktemp -d)"
          ./deploy.sh --dry-run | tee "$RUNNER_TEMP/dry"
          grep -q "WOULD INSTALL $HOME/.aliases" "$RUNNER_TEMP/dry"
          test -z "$(ls -A "$HOME")"

      # A symlinked destination must have its target updated and the link
      # itself preserved.
      - name: deploy.sh follows symlinked destinations
        run: |
          export HOME="$(mktemp -d)"
          echo old > "$HOME/real-aliases"
          ln -s real-aliases "$HOME/.aliases"
          ./deploy.sh
          test -L "$HOME/.aliases"
          cmp .aliases "$HOME/real-aliases"

      # An unwritable destination must be reported with ERROR and a non-zero
      # exit when executed, while sourcing (bash and zsh) must still never
      # exit the caller's shell.
      - name: deploy.sh reports unwritable destinations
        run: |
          export HOME="$(mktemp -d)"
          echo old > "$HOME/.emacs"
          chmod 444 "$HOME/.emacs"
          if ./deploy.sh > "$RUNNER_TEMP/out"; then exit 1; fi
          grep -q "ERROR $HOME/.emacs is not writable" "$RUNNER_TEMP/out"
          grep -q "Done, with errors" "$RUNNER_TEMP/out"
          bash -c 'source ./deploy.sh >/dev/null; echo alive' | grep -q alive
          zsh -c 'source ./deploy.sh >/dev/null; echo alive' | grep -q alive

      - name: source .aliases in bash and zsh
        run: |
          bash -c 'source ./.aliases && type ipa >/dev/null && type rmbak >/dev/null && type lsd | grep -q function'
          zsh -c 'source ./.aliases && type ipa >/dev/null && type rmbak >/dev/null && type lsd | grep -q function'
          # Re-sourcing over the old lsd alias must not be a syntax error.
          bash -c 'shopt -s expand_aliases; alias lsd=ls; source ./.aliases && type lsd | grep -q function'
          zsh -c 'alias lsd=ls; source ./.aliases && type lsd | grep -q function'

      - name: source rc files
        run: |
          bash -i -c 'source ./Linux/.bashrc && [ -n "$PS1" ]'
          zsh -c 'source ./MacOS/.zshrc && [ -n "$PROMPT" ]'

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # Exercises the Darwin case in deploy.sh (installs .zshrc).
      - name: deploy.sh smoke test
        run: |
          # A stub opencode on PATH must enable the opencode config deploy.
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\n' > "$RUNNER_TEMP/bin/opencode"
          chmod +x "$RUNNER_TEMP/bin/opencode"
          PATH="$RUNNER_TEMP/bin:$PATH" ./deploy.sh
          test -f "$HOME/.aliases"
          test -f "$HOME/.emacs"
          test -f "$HOME/.zshrc"
          test -f "$HOME/.config/opencode/opencode.jsonc"
          # Merge must keep existing settings alongside the statusLine.
          echo '{"model":"opus","statusLine":{"type":"static"}}' > "$HOME/.claude/settings.json"
          ./deploy.sh
          jq -e '.model == "opus" and .statusLine.type == "command"' "$HOME/.claude/settings.json"

      # Runs the Darwin-only branches for real: ls -G aliases, Emacs.app
      # detection, and the xcrun LIBRARY_PATH export in .zshrc.
      - name: source .aliases and .zshrc in macOS zsh
        run: |
          zsh -c 'source "$HOME/.aliases" && type ipa >/dev/null && type rmbak >/dev/null && alias ls | grep -q -- "-G"'
          zsh -c 'source "$HOME/.zshrc" && [ -n "$PROMPT" ] && [ -n "$LIBRARY_PATH" ]'

      - name: macos-fix-home-end.sh
        run: |
          bash MacOS/macos-fix-home-end.sh
          test -f "$HOME/Library/KeyBindings/DefaultKeyBinding.dict"

  powershell:
    name: PowerShell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Parses all .ps1 files and lints them; fails the build on Error-severity
      # findings, prints Warnings for information.
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path Windows -Recurse
          if ($results) {
            $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize | Out-String -Width 200 | Write-Host
          }
          if ($results | Where-Object Severity -eq 'Error') { exit 1 }
